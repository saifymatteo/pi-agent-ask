# Publish to npm on `ask-v*` tags — auth via npm Trusted Publishing (OIDC), no NPM_TOKEN.
# Upstream uses bare `v*` tags, so this fork namespaces its releases as `ask-v*` to
# avoid ever colliding with an upstream tag of the same version.
name: Publish to npm
on:
  push:
    tags:
      - "ask-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing (>= 11.5)
        run: npm install -g npm@latest
      - name: Assert tag matches package.json version
        run: |
          node -e "const v=require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'ask-v'+v) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version ask-v' + v); process.exit(1); }"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check whether this version is already on npm
        id: published
        run: |
          if npm view "@saifymatteo/pi-agent-ask@$(node -p 'require("./package.json").version')" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Version already published — skipping npm publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.already == 'false'
        run: npm publish --ignore-scripts
